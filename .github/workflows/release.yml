name: Release

# Runs when you push a tag like v1.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: win-x64
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-latest
            name: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build executable
        run: npm run build:exe

      # Apple Silicon only runs signed binaries; an ad-hoc signature is enough
      - name: Sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --sign - dist/duckpilot

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/duckpilot.exe -DestinationPath duckpilot-${{ matrix.name }}.zip

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        run: tar -czf duckpilot-${{ matrix.name }}.tar.gz -C dist duckpilot

      - uses: actions/upload-artifact@v4
        with:
          name: duckpilot-${{ matrix.name }}
          path: |
            duckpilot-${{ matrix.name }}.zip
            duckpilot-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        working-directory: assets
        run: sha256sum * > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true